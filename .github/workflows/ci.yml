name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Every job runs the same Makefile targets a developer runs locally — the
# Makefile is the single source of truth for how things are built and tested.
# The box is bun-first (only bun.lock exists), so `make install` uses bun.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: make install

      - name: Run oxlint
        run: make front-lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: make install

      - name: Run tsc
        run: make front-typecheck

  # The dual-mode suite runs twice: once headless under bun (fast, logic +
  # component halves) and once for real in Chromium via Playwright (the
  # browser halves and e2eOnly scenarios). Same test definitions, two modes.
  test-bun:
    name: Tests - Bun Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: make install

      - name: Run the dual-mode suite (bun runner)
        run: make test-unit

  test-playwright:
    name: Tests - Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: make install

      - name: Install Playwright browsers
        run: cd nnvp-client-vue && bunx playwright install --with-deps chromium

      - name: Run the dual-mode suite (Playwright)
        # make test-e2e forces the BUN runtime (`bunx --bun`): the runner
        # image ships node, and node's strict ESM resolution rejects the
        # suite's extensionless/vite-style imports. The dev box has no node
        # at all, so this keeps CI and local runs identical. The playwright
        # config self-starts vite, bun-aware and IPv4-pinned.
        run: make test-e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nnvp-client-vue/playwright-report/
          retention-days: 1
