name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# The box is bun-first: no package-lock.json exists, so every job installs
# with bun (setup-node's npm cache used to fail on the missing lockfile and
# killed the old Lint/E2E jobs during setup).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nnvp-client-vue

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run oxlint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nnvp-client-vue

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tsc
        run: bun run typecheck

  # The dual-mode suite runs twice: once headless under bun (fast, logic +
  # component halves) and once for real in Chromium via Playwright (the
  # browser halves and e2eOnly scenarios). Same test definitions, two modes.
  test-bun:
    name: Tests - Bun Runner
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nnvp-client-vue

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the dual-mode suite (bun runner)
        run: bun run test:fast

  test-playwright:
    name: Tests - Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nnvp-client-vue

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run the dual-mode suite (Playwright)
        run: PW_DISABLE_TS_ESM=1 bunx playwright test
        # The config self-starts vite (bun-aware, IPv4-pinned) — see
        # nnvp-client-vue/playwright.config.js.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nnvp-client-vue/playwright-report/
          retention-days: 1
